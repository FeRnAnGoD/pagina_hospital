services:
  # ── Hospital Clínico Ciberlab (Contenedor Unificado) ──
  hospital:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ciberlab-hospital-ctf
    restart: unless-stopped
    ports:
      - "8002:80"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - RASPI_OT_URL=http://10.10.20.67:5050/ot/hospital
    volumes:
      - hospital_db_data:/app/backend/app/data

volumes:
  hospital_db_data:
    name: hospital_db_data
