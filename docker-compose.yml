services:
  # ── Backend Flask / Gunicorn ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospital_backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistir la base de datos SQLite fuera del contenedor
      - hospital_db:/app/app/data
    networks:
      - hospital_net
    # El backend NO expone puertos al host (solo accesible internamente)

  # ── Frontend React + Nginx ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospital_frontend
    restart: unless-stopped
    ports:
      - "8002:80"          # Puerto expuesto en la máquina Debian
    depends_on:
      - backend
    networks:
      - hospital_net

volumes:
  hospital_db:
    name: hospital_db_data

networks:
  hospital_net:
    driver: bridge
    name: hospital_network
